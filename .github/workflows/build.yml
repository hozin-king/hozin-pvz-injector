name: Android CI — auto build + release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "debug.keystore dipulihkan dari secret — build memakai tanda tangan persisten"
          else
            echo "DEBUG_KEYSTORE_BASE64 tidak ada — AGP memakai debug keystore ephemeral (tanda tangan berubah tiap run)"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;25.2.9519653" "cmake;3.22.1" \
            "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify native libs packaged
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "--- lib/arm64-v8a di APK ---"
          unzip -l "$APK" | grep "lib/arm64-v8a" || true
          for lib in libpayload.so libinjector.so; do
            SIZE=$(unzip -p "$APK" "lib/arm64-v8a/$lib" | wc -c)
            echo "$lib: $SIZE byte"
            if [ "$SIZE" -lt 10000 ]; then echo "$lib HILANG/terlalu kecil — gagal"; exit 1; fi
          done

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || true)
          if [ -z "$VERSION" ]; then echo "versionName tidak ditemukan di app/build.gradle.kts"; exit 1; fi
          TAG="v$VERSION"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" "HozinPvZInjector-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "HozinPvZInjector-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "HozinPvZInjector-$VERSION.apk" --title "Hozin PvZ Injector $VERSION" --notes "Build otomatis dari branch main. Root injector untuk Plants vs Zombies 2 Free 3.18.0 (solo/offline saja). Fitur: sun tak habis, 1-hit kill, tanam gratis, super mower. Tanpa coins/gems/IAP. Butuh HP root + PvZ2 3.18.0 asli."
          fi
